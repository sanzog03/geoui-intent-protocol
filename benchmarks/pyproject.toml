[project]
name = "geouibench"
version = "0.1.0"
description = "deepeval benchmark utility for agents that drive a geospatial UI: simulated multi-turn users, per-turn traces, six outcome-first metrics, offline re-scoring, cross-agent comparison"
requires-python = ">=3.12"
dependencies = [
    "geoui-protocol",
    "pydantic>=2.11.7",
    "pydantic-ai>=2.63,<3",
    "deepeval>=4.3,<5",
    # deepeval's pydantic-ai integration imports this lazily and does not declare it
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "httpx>=0.27",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
geoui-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geouibench*"]
exclude = ["geouibench.tests*"]
namespaces = false
