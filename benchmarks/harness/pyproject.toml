[project]
name = "geobench"
version = "0.1.0"
description = "Mechanism-neutral deepeval benchmark harness for agents that drive a geospatial UI (GeoUI-protocol or VLM/browser alike)"
requires-python = ">=3.12"
dependencies = [
    "geoui-protocol",
    "pydantic>=2.11.7",
    "pydantic-ai>=2.63,<3",
    "deepeval>=4.3,<5",
    # deepeval's pydantic-ai integration imports this lazily and does not declare it
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "httpx>=0.27",
    "python-dateutil>=2.8",
]

[tool.uv.sources]
geoui-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geobench*"]
exclude = ["geobench.tests*"]
namespaces = false
