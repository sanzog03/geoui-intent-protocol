[project]
name = "geoui-worldview-benchmark"
version = "0.1.0"
description = "Worldview bindings, datasets and deepeval suite comparing the GeoUI and VLM Worldview agents on geobench"
requires-python = ">=3.12"
dependencies = [
    "geobench",
    "geoui-worldview-demo",
]

[tool.uv.sources]
geobench = { workspace = true }
geoui-worldview-demo = { workspace = true }

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worldview_benchmark*"]
exclude = ["worldview_benchmark.tests*"]
namespaces = false
