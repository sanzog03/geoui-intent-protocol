[project]
name = "geoui-bridge"
version = "0.1.0"
description = "GeoUI MCP over Chrome DevTools Protocol: the three protocol tools for any page that exposes window.geoui (the @geoui/react SDK)"
requires-python = ">=3.12"
dependencies = [
    "geoui-protocol",
    "pydantic>=2.7",
    # connect_over_cdp only: the driver ships in the wheel, no browser download is needed
    "playwright>=1.64,<2",
    "fastmcp>=3.3,<4",
    "pydantic-ai>=2.63,<3",
    "python-dotenv>=1.0",
]

[project.scripts]
geoui-bridge-mcp = "geoui_bridge.mcp.server:main"

[tool.uv.sources]
geoui-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoui_bridge*"]
exclude = ["geoui_bridge.tests*"]
