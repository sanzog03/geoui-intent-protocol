[project]
name = "geoui-protocol"
version = "0.1.0"
description = "GeoUI Intent Protocol: app-agnostic geospatial-UI intent schema and extensions"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sanjog Thapa", email = "st0128@uah.edu" }]
keywords = ["geospatial", "agents", "mcp", "worldview", "intent-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/NASA-IMPACT/geoui-intent-protocol"

[tool.uv.workspace]
members = ["demo", "benchmarks", "bridge"]

[tool.uv.sources]
# The Worldview demo (adapter, tools, MCP server, agents) is a sibling project; the dev
# group installs it editable so `uv run` sees `worldview` the same way it sees `geoui`.
geoui-worldview-demo = { workspace = true }
# The benchmark utility (deepeval) is the third member; only the dev group pulls it
# in, so the library and the demo stay deepeval-free. App bindings under
# benchmarks/<app>/ are plain directories the utility loads by path, not packages.
geouibench = { workspace = true }
# The CDP bridge (GeoUI MCP for any window.geoui page) is the fourth member; it needs
# playwright, which only it declares.
geoui-bridge = { workspace = true }

[dependency-groups]
dev = [
    "geoui-worldview-demo",
    "geouibench",
    "geoui-bridge",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "pre-commit>=4.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoui*"]
exclude = ["tests*", "demo*", "benchmarks*", "bridge*", "docs*", "scripts*", "worldview*", "sdk*", "schemas*", "node_modules*"]

[tool.setuptools.package-data]
geoui = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "demo/worldview/tests",
    "benchmarks/geouibench/tests",
    "benchmarks/worldview/tests",
    "bridge/geoui_bridge/tests",
]
# deepeval registers a pytest plugin that would load into every run; `deepeval test run`
# re-enables it explicitly, so the unit suite stays free of it.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:deepeval"]
markers = [
    "agents: needs the geoui-worldview-demo project (pydantic-ai, vendored plugin)",
    "integration: spawns a subprocess or touches the network",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# vendored plugin submodule and skills are not ours to lint or reformat
extend-exclude = ["demo/worldview/agents/artifact", "*.md", "node_modules"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint.isort]
# the three workspace packages are first-party wherever they are imported from
known-first-party = ["geoui", "worldview", "geouibench", "geoui_bridge"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841"]
"demo/worldview/tests/**/*.py" = ["F841"]
"benchmarks/**/tests/**/*.py" = ["F841"]
# marimo notebook: bare expressions render cell output; silent excepts guard UI teardown
"demo/chat.py" = ["B018", "S110"]
