[project]
name = "geoui-worldview-demo"
version = "0.1.0"
description = "NASA Worldview reference adapter, MCP server, agents and chat demo for the GeoUI Intent Protocol"
requires-python = ">=3.12"
dependencies = [
    "geoui-protocol",
    "python-dateutil>=2.8",
    "fastmcp>=3.0,<3.2.4",
    "akd-ext @ git+https://github.com/NASA-IMPACT/akd-ext.git@2ca52da191f756b62378c828a2f9eb66494cb707",
    # akd-ext at the pinned commit imports pydantic_ai.messages.BuiltinToolCallEvent, removed in pydantic-ai 2.x
    "pydantic-ai>=1.81.0,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # marimo 0.25.x frontend rejects its own chat requests (messages[0].metadata); 0.23 is what the poster runs used
    "marimo>=0.23.1,<0.24",
]

[project.scripts]
worldview-mcp = "worldview.mcp.server:main"

[tool.uv.sources]
geoui-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worldview*"]
exclude = ["worldview.tests*"]
